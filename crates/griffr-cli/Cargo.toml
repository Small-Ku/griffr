[package]
name = "griffr-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for Griffr game launcher"

[[bin]]
name = "griffr"
path = "src/main.rs"

[dependencies]
griffr-core = { workspace = true }
griffr-hypergryph-api = { workspace = true }
griffr-yostar-api = { workspace = true }
griffr-runtime = { workspace = true }

# Core
compio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { workspace = true }
indicatif = { workspace = true }

# Async utilities
futures-util = "0.3"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
md5 = { workspace = true }
rapidhash = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
base64 = "0.22"
tempfile = "3.14"
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

nextest-version = "0.9.143"

[profile.ci]
fail-fast = false
status-level = "fail"
final-status-level = "slow"
slow-timeout = { period = "60s", terminate-after = 5 }
leak-timeout = { period = "500ms", result = "fail" }

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
report-skipped = "ignored"

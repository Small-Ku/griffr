name: Extended Platform Tests

on:
  schedule:
    - cron: "17 20 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  wine-launch:
    name: Real Wine launch smoke / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install Wine and PE toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine clang lld
      - name: Exercise real Wine process lifecycle
        env:
          WINEDEBUG: "-all"
        run: cargo test --profile ci -p griffr-runtime --locked launcher::tests::real_wine_launch_smoke -- --ignored --exact --nocapture

name: Live E2E

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Live lane to run. full-matrix fans out every large lane after smoke.
        type: choice
        options: [smoke, archive-sample, lifecycle, streaming, full-matrix]
        default: smoke
      runner_os:
        description: Hosted OS matrix for large lanes. Smoke remains Linux-only.
        type: choice
        options: [all, linux, windows]
        default: all
      target:
        description: Deployment matrix selection. YoStar deployments are smoke-only for now.
        type: choice
        options:
          - all
          - endfield-cn-official
          - endfield-cn-bilibili
          - endfield-global-official
          - endfield-global-epic
          - endfield-global-google-play
          - arknights-cn-official
          - arknights-cn-bilibili
          - arknights-en
          - arknights-jp
          - arknights-kr
        default: all
      root:
        description: Optional dedicated live root. Blank uses a lane-scoped directory under RUNNER_TEMP.
        type: string
        required: false
      minimum_free_gib:
        description: Optional free-space floor in GiB; 0 uses the lane default. Lifecycle also checks the current manifest footprint.
        type: string
        default: "0"
      resources:
        description: Persistent Endfield resource scope for lifecycle. Arknights CN is forced to off because its launcher has no Endfield resource API.
        type: choice
        options: ["off", base, all]
        default: "off"
      fetch_predownload:
        description: Also fetch an advertised predownload payload during lifecycle.
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: live-e2e-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  plan:
    name: Select live lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      smoke: ${{ steps.plan.outputs.smoke }}
      archive_sample: ${{ steps.plan.outputs.archive_sample }}
      lifecycle: ${{ steps.plan.outputs.lifecycle }}
      streaming: ${{ steps.plan.outputs.streaming }}
      recommended: ${{ steps.plan.outputs.recommended }}
      live_ref: ${{ steps.plan.outputs.live_ref }}
      smoke_matrix: ${{ steps.matrix.outputs.smoke_matrix }}
      payload_matrix: ${{ steps.matrix.outputs.payload_matrix }}
      run_linux: ${{ steps.matrix.outputs.run_linux }}
      run_windows: ${{ steps.matrix.outputs.run_windows }}
    steps:
      - name: Download exact policy from successful CI run
        id: policy-artifact
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: live-e2e-policy-${{ github.event.workflow_run.head_sha }}
          path: .live-policy
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - id: plan
        name: Classify trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          live_ref="$CURRENT_SHA"
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            live_ref="$RUN_SHA"
            if [[ "$RUN_CONCLUSION" != success || "$RUN_EVENT" != push ]]; then
              printf '%s\n' 'smoke=false' 'archive_sample=false' 'lifecycle=false' 'streaming=false' 'recommended=none' >> "$GITHUB_OUTPUT"
              printf 'live_ref=%s\n' "$live_ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -f .live-policy/live-e2e-policy.json ]]; then
              python - <<'PY_POLICY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          payload = json.loads(Path('.live-policy/live-e2e-policy.json').read_text())
          # Automatic production work stays read-only. The policy artifact can
          # recommend large lanes for a human-triggered follow-up, but a
          # workflow_run never starts large CDN traffic by itself.
          print(f"smoke={str(bool(payload['smoke'])).lower()}")
          print("archive_sample=false")
          print("lifecycle=false")
          print("streaming=false")
          print(f"recommended={payload['recommended']}")
          PY_POLICY
            else
              echo 'CI policy artifact is unavailable; conservatively falling back to read-only smoke.' >&2
              printf '%s\n' 'smoke=true' 'archive_sample=false' 'lifecycle=false' 'streaming=false' 'recommended=smoke-fallback' >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT_NAME" == schedule ]]; then
            printf '%s\n' 'smoke=true' 'archive_sample=false' 'lifecycle=false' 'streaming=false' 'recommended=smoke' >> "$GITHUB_OUTPUT"
          else
            smoke=true
            archive_sample=false
            lifecycle=false
            streaming=false
            case "$DISPATCH_MODE" in
              archive-sample) archive_sample=true ;;
              lifecycle) lifecycle=true ;;
              streaming) streaming=true ;;
              full-matrix)
                archive_sample=true
                lifecycle=true
                streaming=true
                ;;
            esac
            printf 'smoke=%s\narchive_sample=%s\nlifecycle=%s\nstreaming=%s\nrecommended=%s\n' \
              "$smoke" "$archive_sample" "$lifecycle" "$streaming" "$DISPATCH_MODE" >> "$GITHUB_OUTPUT"
          fi
          printf 'live_ref=%s\n' "$live_ref" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Build deployment and platform matrices
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SELECTION: ${{ inputs.target }}
          RUNNER_SELECTION: ${{ inputs.runner_os }}
          SMOKE: ${{ steps.plan.outputs.smoke }}
          ARCHIVE_SAMPLE: ${{ steps.plan.outputs.archive_sample }}
          LIFECYCLE: ${{ steps.plan.outputs.lifecycle }}
          STREAMING: ${{ steps.plan.outputs.streaming }}
        run: |
          python - <<'PY_MATRIX' >> "$GITHUB_OUTPUT"
          import json
          import os

          targets = [
              dict(id="endfield-cn-official", label="Endfield CN Official", backend="hypergryph", game="endfield", region="cn", channel="1", sub_channel="1", payload=True, resources=True),
              dict(id="endfield-cn-bilibili", label="Endfield CN Bilibili", backend="hypergryph", game="endfield", region="cn", channel="2", sub_channel="2", payload=True, resources=True),
              dict(id="endfield-global-official", label="Endfield Global Official", backend="hypergryph", game="endfield", region="sg", channel="6", sub_channel="6", payload=True, resources=True),
              dict(id="endfield-global-epic", label="Endfield Global Epic", backend="hypergryph", game="endfield", region="sg", channel="6", sub_channel="801", payload=True, resources=True),
              dict(id="endfield-global-google-play", label="Endfield Global Google Play", backend="hypergryph", game="endfield", region="sg", channel="6", sub_channel="802", payload=True, resources=True),
              dict(id="arknights-cn-official", label="Arknights CN Official", backend="hypergryph", game="arknights", region="cn", channel="1", sub_channel="1", payload=True, resources=False),
              dict(id="arknights-cn-bilibili", label="Arknights CN Bilibili", backend="hypergryph", game="arknights", region="cn", channel="2", sub_channel="2", payload=True, resources=False),
              dict(id="arknights-en", label="Arknights EN", backend="yostar", game="arknights", region="en", channel="", sub_channel="", payload=False, resources=False),
              dict(id="arknights-jp", label="Arknights JP", backend="yostar", game="arknights", region="jp", channel="", sub_channel="", payload=False, resources=False),
              dict(id="arknights-kr", label="Arknights KR", backend="yostar", game="arknights", region="kr", channel="", sub_channel="", payload=False, resources=False),
          ]
          by_id = {target["id"]: target for target in targets}
          selection = os.environ.get("TARGET_SELECTION") or "all"
          selected = targets if selection == "all" else [by_id[selection]]

          large_requested = os.environ.get("LIFECYCLE") == "true" or os.environ.get("STREAMING") == "true"
          payload = [target for target in selected if target["payload"]]
          if large_requested and selection != "all" and not payload:
              raise SystemExit(
                  f"target {selection!r} is YoStar smoke-only; lifecycle/streaming currently require a Hypergryph/Gryphline PC payload target"
              )

          smoke_matrix = selected if os.environ.get("SMOKE") == "true" else []
          payload_matrix = payload if large_requested else []
          print("smoke_matrix=" + json.dumps(smoke_matrix, separators=(",", ":")))
          print("payload_matrix=" + json.dumps(payload_matrix, separators=(",", ":")))

          archive = os.environ.get("ARCHIVE_SAMPLE") == "true"
          lifecycle = os.environ.get("LIFECYCLE") == "true"
          streaming = os.environ.get("STREAMING") == "true"
          large = archive or lifecycle or streaming
          runner = os.environ.get("RUNNER_SELECTION") or "all"
          need_linux = os.environ.get("SMOKE") == "true" or (large and runner in {"all", "linux"})
          need_windows = os.environ.get("EVENT_NAME") == "workflow_dispatch" and large and runner in {"all", "windows"}
          print(f"run_linux={str(need_linux).lower()}")
          print(f"run_windows={str(need_windows).lower()}")
          PY_MATRIX
      - name: Summarize decision
        shell: bash
        env:
          RECOMMENDED: ${{ steps.plan.outputs.recommended }}
          TARGET_SELECTION: ${{ inputs.target }}
          RUNNER_SELECTION: ${{ inputs.runner_os }}
        run: |
          {
            echo '### Live E2E policy'
            echo
            echo "Recommended lanes: \`$RECOMMENDED\`."
            echo "Target selection: \`${TARGET_SELECTION:-all}\`; hosted OS selection: \`${RUNNER_SELECTION:-linux}\`."
            echo
            echo 'Read-only production smoke fans out by deployment. Manual archive/lifecycle/streaming lanes fan out by selected hosted OS and deployment, use fail-fast=false, keep the live-e2e Environment approval, and check free space before production payload I/O.'
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-live-linux:
    name: Prepare archived live tests / Linux
    needs: plan
    if: needs.plan.outputs.run_linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.live_ref }}
      - id: ci-archive
        name: Reuse exact Linux archive from triggering CI
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: nextest-linux-${{ needs.plan.outputs.live_ref }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: ./.github/actions/setup-rust
        if: github.event_name != 'workflow_run' || steps.ci-archive.outcome != 'success'
      - uses: taiki-e/install-action@v2.85.13
        if: github.event_name != 'workflow_run' || steps.ci-archive.outcome != 'success'
        with:
          tool: cargo-nextest@0.9.143
      - name: Compile one workspace archive for every Linux live matrix cell
        if: github.event_name != 'workflow_run' || steps.ci-archive.outcome != 'success'
        run: cargo nextest archive --workspace --cargo-profile ci -P ci --locked --archive-file nextest-linux.tar.zst
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: live-nextest-linux-${{ github.run_id }}
          path: nextest-linux.tar.zst
          compression-level: 0
          overwrite: true
          retention-days: 1

  prepare-live-windows:
    name: Prepare archived live tests / Windows
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.run_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.live_ref }}
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest@0.9.143
      - name: Compile one workspace archive for every Windows live matrix cell
        run: cargo nextest archive --workspace --cargo-profile ci -P ci --locked --archive-file nextest-windows.tar.zst
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: live-nextest-windows-${{ github.run_id }}
          path: nextest-windows.tar.zst
          compression-level: 0
          overwrite: true
          retention-days: 1

  smoke:
    name: Production smoke / ${{ matrix.label }}
    needs: [plan, prepare-live-linux]
    if: needs.plan.outputs.smoke == 'true' && needs.prepare-live-linux.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.live_ref }}
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/download-artifact@v8.0.1
        with:
          name: live-nextest-linux-${{ github.run_id }}
      - name: CLI production contract
        env:
          GRIFFR_LIVE_SMOKE_GAME: ${{ matrix.game }}
          GRIFFR_LIVE_SMOKE_REGION: ${{ matrix.region }}
          GRIFFR_LIVE_SMOKE_CHANNEL: ${{ matrix.channel }}
          GRIFFR_LIVE_SMOKE_SUB_CHANNEL: ${{ matrix.sub_channel }}
        run: cargo-nextest nextest run -P ci --archive-file nextest-linux.tar.zst --workspace-remap "${{ github.workspace }}" --run-ignored only --no-capture official_api_smoke
      - name: Hypergryph protocol contract
        if: matrix.backend == 'hypergryph'
        env:
          GRIFFR_LIVE_SMOKE_GAME: ${{ matrix.game }}
          GRIFFR_LIVE_SMOKE_REGION: ${{ matrix.region }}
          GRIFFR_LIVE_SMOKE_CHANNEL: ${{ matrix.channel }}
          GRIFFR_LIVE_SMOKE_SUB_CHANNEL: ${{ matrix.sub_channel }}
        run: cargo-nextest nextest run -P ci --archive-file nextest-linux.tar.zst --workspace-remap "${{ github.workspace }}" --run-ignored only --no-capture integration_tests::test_real_api_contract_target

  archive-sample-linux:
    name: Official archive range sample / Linux
    needs: [plan, prepare-live-linux, smoke]
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.archive_sample == 'true' && needs.plan.outputs.run_linux == 'true' && needs.prepare-live-linux.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: live-e2e
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.live_ref }}
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/download-artifact@v8.0.1
        with:
          name: live-nextest-linux-${{ github.run_id }}
      - id: live-root
        name: Prepare hosted live workspace
        env:
          GRIFFR_LIVE_ROOT_INPUT: ${{ inputs.root }}
          GRIFFR_LIVE_MIN_FREE_GIB: ${{ inputs.minimum_free_gib }}
        run: python scripts/ci/prepare_live_workspace.py --lane archive-sample --github-output
      - name: Sample current official multi-volume archive
        env:
          GRIFFR_LIVE_E2E_ROOT: ${{ steps.live-root.outputs.root }}
        run: cargo-nextest nextest run -P live-e2e --archive-file nextest-linux.tar.zst --workspace-remap "${{ github.workspace }}" --run-ignored only --no-capture download::extractor::tests::format_check::check_official_archive_sample

  archive-sample-windows:
    name: Official archive range sample / Windows
    needs: [plan, prepare-live-windows, smoke]
    if: always() && github.event_name == 'workflow_dispatch' && needs.plan.outputs.archive_sample == 'true' && needs.plan.outputs.run_windows == 'true' && needs.prepare-live-windows.result == 'success' && needs.smoke.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 90
    environment: live-e2e
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.live_ref }}
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/download-artifact@v8.0.1
        with:
          name: live-nextest-windows-${{ github.run_id }}
      - id: live-root
        name: Prepare hosted live workspace
        env:
          GRIFFR_LIVE_ROOT_INPUT: ${{ inputs.root }}
          GRIFFR_LIVE_MIN_FREE_GIB: ${{ inputs.minimum_free_gib }}
        run: python scripts/ci/prepare_live_workspace.py --lane archive-sample --github-output
      - name: Sample current official multi-volume archive
        env:
          GRIFFR_LIVE_E2E_ROOT: ${{ steps.live-root.outputs.root }}
        run: cargo-nextest nextest run -P live-e2e --archive-file nextest-windows.tar.zst --workspace-remap "${{ github.workspace }}" --run-ignored only --no-capture download::extractor::tests::format_check::check_official_archive_sample

  lifecycle-linux:
    name: Full lifecycle / Linux / ${{ matrix.label }}
    needs: [plan, prepare-live-linux, smoke]
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.lifecycle == 'true' && needs.plan.outputs.run_linux == 'true' && needs.prepare-live-linux.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: live-e2e
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.payload_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.live_ref }}
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/download-artifact@v8.0.1
        with:
          name: live-nextest-linux-${{ github.run_id }}
      - id: live-root
        name: Prepare hosted live workspace
        env:
          GRIFFR_LIVE_ROOT_INPUT: ${{ inputs.root }}
          GRIFFR_LIVE_MIN_FREE_GIB: ${{ inputs.minimum_free_gib }}
        run: python scripts/ci/prepare_live_workspace.py --lane lifecycle --github-output
      - name: Check current install footprint against hosted disk
        env:
          GRIFFR_LIVE_E2E_ROOT: ${{ steps.live-root.outputs.root }}
          GRIFFR_LIVE_E2E_GAME: ${{ matrix.game }}
          GRIFFR_LIVE_E2E_REGION: ${{ matrix.region }}
          GRIFFR_LIVE_E2E_CHANNEL: ${{ matrix.channel }}
          GRIFFR_LIVE_E2E_SUB_CHANNEL: ${{ matrix.sub_channel }}
          GRIFFR_LIVE_E2E_RESOURCES: ${{ matrix.resources && inputs.resources || 'off' }}
          GRIFFR_LIVE_E2E_CONFIRM: I_ACCEPT_LARGE_DOWNLOADS_AND_TEST_DELETION
        run: cargo-nextest nextest run -P live-e2e --archive-file nextest-linux.tar.zst --workspace-remap "${{ github.workspace }}" --run-ignored only --no-capture official_server_content_lifecycle_disk_preflight
      - name: Run destructive official-server lifecycle
        env:
          GRIFFR_LIVE_E2E_ROOT: ${{ steps.live-root.outputs.root }}
          GRIFFR_LIVE_E2E_GAME: ${{ matrix.game }}
          GRIFFR_LIVE_E2E_REGION: ${{ matrix.region }}
          GRIFFR_LIVE_E2E_CHANNEL: ${{ matrix.channel }}
          GRIFFR_LIVE_E2E_SUB_CHANNEL: ${{ matrix.sub_channel }}
          GRIFFR_LIVE_E2E_RESOURCES: ${{ matrix.resources && inputs.resources || 'off' }}
          GRIFFR_LIVE_E2E_FETCH_PREDOWNLOAD: ${{ inputs.fetch_predownload && '1' || '0' }}
          GRIFFR_LIVE_E2E_CONFIRM: I_ACCEPT_LARGE_DOWNLOADS_AND_TEST_DELETION
        run: cargo-nextest nextest run -P live-e2e --archive-file nextest-linux.tar.zst --workspace-remap "${{ github.workspace }}" --run-ignored only --no-capture official_server_content_lifecycle_without_launch

  lifecycle-windows:
    name: Full lifecycle / Windows / ${{ matrix.label }}
    needs: [plan, prepare-live-windows, smoke]
    if: always() && github.event_name == 'workflow_dispatch' && needs.plan.outputs.lifecycle == 'true' && needs.plan.outputs.run_windows == 'true' && needs.prepare-live-windows.result == 'success' && needs.smoke.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 360
    environment: live-e2e
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.payload_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.live_ref }}
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/download-artifact@v8.0.1
        with:
          name: live-nextest-windows-${{ github.run_id }}
      - id: live-root
        name: Prepare hosted live workspace
        env:
          GRIFFR_LIVE_ROOT_INPUT: ${{ inputs.root }}
          GRIFFR_LIVE_MIN_FREE_GIB: ${{ inputs.minimum_free_gib }}
        run: python scripts/ci/prepare_live_workspace.py --lane lifecycle --github-output
      - name: Check current install footprint against hosted disk
        env:
          GRIFFR_LIVE_E2E_ROOT: ${{ steps.live-root.outputs.root }}
          GRIFFR_LIVE_E2E_GAME: ${{ matrix.game }}
          GRIFFR_LIVE_E2E_REGION: ${{ matrix.region }}
          GRIFFR_LIVE_E2E_CHANNEL: ${{ matrix.channel }}
          GRIFFR_LIVE_E2E_SUB_CHANNEL: ${{ matrix.sub_channel }}
          GRIFFR_LIVE_E2E_RESOURCES: ${{ matrix.resources && inputs.resources || 'off' }}
          GRIFFR_LIVE_E2E_CONFIRM: I_ACCEPT_LARGE_DOWNLOADS_AND_TEST_DELETION
        run: cargo-nextest nextest run -P live-e2e --archive-file nextest-windows.tar.zst --workspace-remap "${{ github.workspace }}" --run-ignored only --no-capture official_server_content_lifecycle_disk_preflight
      - name: Run destructive official-server lifecycle
        env:
          GRIFFR_LIVE_E2E_ROOT: ${{ steps.live-root.outputs.root }}
          GRIFFR_LIVE_E2E_GAME: ${{ matrix.game }}
          GRIFFR_LIVE_E2E_REGION: ${{ matrix.region }}
          GRIFFR_LIVE_E2E_CHANNEL: ${{ matrix.channel }}
          GRIFFR_LIVE_E2E_SUB_CHANNEL: ${{ matrix.sub_channel }}
          GRIFFR_LIVE_E2E_RESOURCES: ${{ matrix.resources && inputs.resources || 'off' }}
          GRIFFR_LIVE_E2E_FETCH_PREDOWNLOAD: ${{ inputs.fetch_predownload && '1' || '0' }}
          GRIFFR_LIVE_E2E_CONFIRM: I_ACCEPT_LARGE_DOWNLOADS_AND_TEST_DELETION
        run: cargo-nextest nextest run -P live-e2e --archive-file nextest-windows.tar.zst --workspace-remap "${{ github.workspace }}" --run-ignored only --no-capture official_server_content_lifecycle_without_launch

  streaming-linux:
    name: Package streaming / Linux / ${{ matrix.label }}
    needs: [plan, prepare-live-linux, smoke]
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.streaming == 'true' && needs.plan.outputs.run_linux == 'true' && needs.prepare-live-linux.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: live-e2e
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.payload_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.live_ref }}
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/download-artifact@v8.0.1
        with:
          name: live-nextest-linux-${{ github.run_id }}
      - id: live-root
        name: Prepare hosted live workspace
        env:
          GRIFFR_LIVE_ROOT_INPUT: ${{ inputs.root }}
          GRIFFR_LIVE_MIN_FREE_GIB: ${{ inputs.minimum_free_gib }}
        run: python scripts/ci/prepare_live_workspace.py --lane streaming --github-output
      - name: Stream and discard official package parts
        env:
          GRIFFR_LIVE_E2E_ROOT: ${{ steps.live-root.outputs.root }}
          GRIFFR_LIVE_E2E_GAME: ${{ matrix.game }}
          GRIFFR_LIVE_E2E_REGION: ${{ matrix.region }}
          GRIFFR_LIVE_E2E_CHANNEL: ${{ matrix.channel }}
          GRIFFR_LIVE_E2E_SUB_CHANNEL: ${{ matrix.sub_channel }}
          GRIFFR_LIVE_E2E_RESOURCES: "off"
          GRIFFR_LIVE_E2E_CONFIRM: I_ACCEPT_LARGE_DOWNLOADS_AND_TEST_DELETION
        run: cargo-nextest nextest run -P live-e2e --archive-file nextest-linux.tar.zst --workspace-remap "${{ github.workspace }}" --run-ignored only --no-capture official_server_streaming_package_soak

  streaming-windows:
    name: Package streaming / Windows / ${{ matrix.label }}
    needs: [plan, prepare-live-windows, smoke]
    if: always() && github.event_name == 'workflow_dispatch' && needs.plan.outputs.streaming == 'true' && needs.plan.outputs.run_windows == 'true' && needs.prepare-live-windows.result == 'success' && needs.smoke.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 360
    environment: live-e2e
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.payload_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.live_ref }}
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest@0.9.143
      - uses: actions/download-artifact@v8.0.1
        with:
          name: live-nextest-windows-${{ github.run_id }}
      - id: live-root
        name: Prepare hosted live workspace
        env:
          GRIFFR_LIVE_ROOT_INPUT: ${{ inputs.root }}
          GRIFFR_LIVE_MIN_FREE_GIB: ${{ inputs.minimum_free_gib }}
        run: python scripts/ci/prepare_live_workspace.py --lane streaming --github-output
      - name: Stream and discard official package parts
        env:
          GRIFFR_LIVE_E2E_ROOT: ${{ steps.live-root.outputs.root }}
          GRIFFR_LIVE_E2E_GAME: ${{ matrix.game }}
          GRIFFR_LIVE_E2E_REGION: ${{ matrix.region }}
          GRIFFR_LIVE_E2E_CHANNEL: ${{ matrix.channel }}
          GRIFFR_LIVE_E2E_SUB_CHANNEL: ${{ matrix.sub_channel }}
          GRIFFR_LIVE_E2E_RESOURCES: "off"
          GRIFFR_LIVE_E2E_CONFIRM: I_ACCEPT_LARGE_DOWNLOADS_AND_TEST_DELETION
        run: cargo-nextest nextest run -P live-e2e --archive-file nextest-windows.tar.zst --workspace-remap "${{ github.workspace }}" --run-ignored only --no-capture official_server_streaming_package_soak
